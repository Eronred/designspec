name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: schema.json is up to date
        if: matrix.os == 'ubuntu-latest'
        run: node dist/cli.js schema | diff - schema.json
      - name: Changeset for package changes
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx changeset status --since=origin/main
