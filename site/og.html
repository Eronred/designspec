<!doctype html>
<!-- Source of og.png (README and social preview). Render at 2x:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,640 --screenshot=og.png og.html -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #0D99FF;
    --accent-soft: #e6f5ff;
    --line: #e3e5ea;
    --fg: #111216;
    --muted: #868b96;
    --red: #e5484d;
    --green: #1f9d5a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: #fbfbfc; font-family: Inter, sans-serif; color: var(--fg); position: relative; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .a { position: absolute; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px;  height: 60px; display: flex; align-items: center; }

  .title { left: 0; right: 0; top: 206px; text-align: center; font-size: 136px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; }
  .title span { color: var(--accent); }

  /* row 1: y 36 */
  .ramp { left: -60px; top: 36px; display: flex; border-radius: 14px; overflow: hidden; height: 60px;  }
  .ramp div { width: 52px; }
  .pass { left: 520px; top: 36px; padding: 0 22px 0 16px; gap: 12px; border-radius: 999px; font-size: 20px; font-weight: 500; white-space: nowrap; }
  .pass .dot { width: 28px; height: 28px; border-radius: 50%; background: #e6f6ed; display: grid; place-items: center; }
  .pass .muted { color: var(--muted); font-weight: 400; }
  .mode { left: 920px; top: 36px; padding: 5px; gap: 4px; border-radius: 999px; background: #f0f1f4; border: 1px solid var(--line);  }
  .mode div { padding: 0 24px; height: 48px; line-height: 48px; border-radius: 999px; font-size: 20px; color: var(--muted); font-weight: 500; }
  .mode .on { background: #fff; color: var(--fg); outline: 1px solid var(--line); }

  /* row 2: y 124 (flanks only, the title sits between) */
  .seg { left: -36px; top: 124px; padding: 5px; gap: 4px; background: #f0f1f4;  }
  .seg div { padding: 0 26px; height: 48px; line-height: 48px; border-radius: 10px; font-size: 20px; color: var(--muted); font-weight: 500; }
  .seg .on { background: #fff; color: var(--fg); outline: 1px solid var(--line); }
  .space { left: 1010px; top: 124px; padding: 0 22px; gap: 16px; font-size: 20px; white-space: nowrap; }
  .measure { position: relative; width: 64px; height: 20px; border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .measure::after { content: ""; position: absolute; left: 0; right: 0; top: 9px; border-top: 2px dashed var(--accent); }
  .space .muted { color: var(--muted); }

  /* title flanks: y 232 */
  .toggle { left: -30px; top: 236px; width: 104px; height: 56px; border-radius: 999px; background: var(--accent); }
  .toggle::after { content: ""; position: absolute; right: 5px; top: 5px; width: 46px; height: 46px; border-radius: 50%; background: #fff; }
  .comps { left: 1160px; top: 236px; height: 56px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .comps b { background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 10px; font-weight: 600; }

  /* row 4: y 382 */
  .btn { left: -24px; top: 382px; height: 60px; padding: 0 32px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 22px; font-weight: 600; display: flex; align-items: center;  }
  .token { left: 440px; top: 124px; padding: 0 20px 0 14px; gap: 14px; font-size: 20px; white-space: nowrap; }
  .sw { width: 32px; height: 32px; border-radius: 8px; background: var(--accent);  }
  .token .muted { color: var(--muted); }
  .fix { left: 196px; top: 382px; padding: 0 14px 0 20px; gap: 14px; font-size: 20px; white-space: nowrap; }
  .bad { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }
  .arrow { color: var(--muted); font-family: Inter, sans-serif; }
  .good { color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: 8px; }
  .squig { left: 680px; top: 382px; padding: 0 22px; font-size: 20px; white-space: nowrap; }
  .squig .err { text-decoration: underline wavy var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 7px; }
  .squig .tag { color: var(--accent); }
  .squig .attr { color: var(--muted); }

  /* row 5: agents */
  .agents { left: 0; right: 0; top: 492px; display: flex; justify-content: center; align-items: flex-end; gap: 28px; }
  .tile { width: 92px; height: 92px; border-radius: 24px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); }
  .tile.dark { background: #17181b; border-color: #17181b; }
  .crab { width: 124px; height: 96px; }

  .select { left: -30px; top: 520px; width: 300px; height: 60px; border: 1.5px solid var(--accent); background: rgba(13,153,255,.05); }
  .select i { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--accent); }
  .select span { position: absolute; right: -1.5px; top: -26px; background: var(--accent); color: #fff; font-size: 13px; padding: 3px 8px; border-radius: 4px 4px 0 4px; }
  .slider { left: 1000px; top: 540px; width: 420px; height: 20px; }
  .slider .track { position: absolute; left: 0; right: 0; top: 7px; height: 6px; border-radius: 999px; background: #e3e5ea; }
  .slider .fill { position: absolute; left: 0; width: 210px; top: 7px; height: 6px; border-radius: 999px; background: var(--accent); }
  .slider .thumb { position: absolute; left: 196px; top: -6px; width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid var(--accent);  }

  /* stacks: color tokens top right, spacing tokens bottom right */
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 12px; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 20px 0 12px; font-size: 19px; white-space: nowrap; }
  .chip .sw { width: 28px; height: 28px; border-radius: 7px; box-shadow: none; }
  .chip .muted { color: var(--muted); }
  .chip .bar { height: 14px; border-radius: 4px; background: var(--accent-soft); border: 1.5px solid var(--accent); }
  .colors { left: 1000px; top: 20px; }
  .spaces { left: 1000px; top: 466px; }
  .slot { width: 48px; display: flex; }
  .spaces .chip { padding-left: 20px; }
</style>
</head>
<body>
  <!-- row 1 -->
  <div class="a ramp">
    <div style="background:#e6f5ff"></div><div style="background:#c2e6ff"></div><div style="background:#8fd1ff"></div><div style="background:#57baff"></div><div style="background:#2aa7ff"></div><div style="background:#0D99FF"></div><div style="background:#0a7fd6"></div><div style="background:#06599a"></div></div>
  </div>
  <div class="a card pass">
    <div class="dot"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#1f9d5a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    designspec check <span class="muted">0 problems</span>
  </div>

  <!-- row 2 -->
  <div class="a card seg"><div>sm</div><div class="on">md</div><div>lg</div><div>icon</div></div>

  <!-- title -->
  <div class="a toggle"></div>
  <h1 class="a title">design<span>spec</span></h1>
  <div class="a comps">Components <b>47</b></div>

  <!-- row 4 -->
  <div class="a btn">Button</div>
  <div class="a card fix mono"><span class="bad">bg-[#e5484d]</span><span class="arrow">→</span><span class="good">bg-destructive</span></div>
  <div class="a card squig mono"><span class="tag">&lt;Button</span>&nbsp;<span class="attr">variant=</span><span class="err">"ghost2"</span><span class="tag">&gt;</span></div>

  <!-- row 5 -->
  <div class="a select"><i style="left:-6px;top:-6px"></i><i style="right:-6px;top:-6px"></i><i style="left:-6px;bottom:-6px"></i><i style="right:-6px;bottom:-6px"></i><span>Card · 300 × 60</span></div>

  <div class="a agents">
    <!-- terminal agent -->
    <div class="tile">
      <svg width="56" height="56" viewBox="0 0 56 56"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b9bff"/><stop offset="1" stop-color="#5a5ff0"/></linearGradient></defs>
        <path d="M28 4l20.8 12v24L28 52 7.2 40V16z" fill="url(#g1)"/>
        <path d="M18 22l7 6-7 6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 35h10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
    </div>
    <!-- cube agent -->
    <div class="tile dark">
      <svg width="52" height="56" viewBox="0 0 52 56"><path d="M26 4l22 12.5L26 29 4 16.5z" fill="#f2f2f2"/><path d="M4 16.5L26 29v25L4 41.5z" fill="#a9abb0"/><path d="M48 16.5L26 29v25l22-12.5z" fill="#6e7076"/></svg>
    </div>
    <!-- coding mascot -->
    <svg class="crab" viewBox="0 0 124 96">
      <rect x="18" y="10" width="88" height="58" rx="6" fill="#d97757"/>
      <rect x="2" y="30" width="18" height="20" rx="3" fill="#d97757"/><rect x="104" y="30" width="18" height="20" rx="3" fill="#d97757"/>
      <rect x="28" y="66" width="10" height="24" rx="2" fill="#d97757"/><rect x="46" y="66" width="10" height="24" rx="2" fill="#d97757"/>
      <rect x="68" y="66" width="10" height="24" rx="2" fill="#d97757"/><rect x="86" y="66" width="10" height="24" rx="2" fill="#d97757"/>
      <rect x="40" y="26" width="9" height="16" rx="1.5" fill="#fff"/><rect x="75" y="26" width="9" height="16" rx="1.5" fill="#fff"/>
    </svg>
    <!-- sparkle agent -->
    <div class="tile">
      <svg width="54" height="54" viewBox="0 0 54 54"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset=".6" stop-color="#8f6cf5"/><stop offset="1" stop-color="#d77fd6"/></linearGradient></defs>
        <path d="M27 2C28.6 15.5 38.5 25.4 52 27 38.5 28.6 28.6 38.5 27 52 25.4 38.5 15.5 28.6 2 27 15.5 25.4 25.4 15.5 27 2z" fill="url(#g2)"/></svg>
    </div>
  </div>

  <div class="a stack colors mono">
    <div class="chip"><div class="sw" style="background:#0D99FF"></div>--primary <span class="muted">bg-primary</span></div>
    <div class="chip"><div class="sw" style="background:#e5484d"></div>--destructive <span class="muted">text-destructive</span></div>
    <div class="chip"><div class="sw" style="background:#f0f1f4;border:1px solid #e3e5ea"></div>--muted <span class="muted">bg-muted</span></div>
  </div>
  <div class="a stack spaces mono">
    <div class="chip"><div class="slot"><div class="bar" style="width:16px"></div></div>--spacing-2 <span class="muted">8px</span></div>
    <div class="chip"><div class="slot"><div class="bar" style="width:32px"></div></div>--spacing-4 <span class="muted">16px</span></div>
    <div class="chip"><div class="slot"><div class="bar" style="width:48px"></div></div>--spacing-6 <span class="muted">24px</span></div>
  </div>
</body>
</html>
